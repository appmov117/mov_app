[project]
name = "ruta"
version = "0.1.0"
description = "PWA de viajes con membresía fija para conductores"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "geoalchemy2>=0.16",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "PyJWT>=2.9",
  "python-multipart>=0.0.18",
  "httpx>=0.28",
  "pywebpush>=2.5.0",
  "redis>=5.2",
  "h3>=4.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
